<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hirely-icon-title hirely-icon-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hirely-icon-title">Hirely</title>
  <desc id="hirely-icon-desc">Hirely app icon: an abstract geometric mark of two interconnected curved forms with an upward arrow, in blue gradients, on a rounded squircle background.</desc>

  <defs>
    <!-- App icon background -->
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#0B4F9E"/>
    </linearGradient>

    <!-- Mark gradients -->
    <linearGradient id="blueGradientA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63B4F4"/>
      <stop offset="100%" stop-color="#2E8BE6"/>
    </linearGradient>

    <linearGradient id="blueGradientB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD3FF"/>
      <stop offset="100%" stop-color="#4FA6EE"/>
    </linearGradient>

    <linearGradient id="arrowGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFE9FF"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#031B3D" flood-opacity="0.35"/>
    </filter>

    <!-- App-icon squircle mask -->
    <clipPath id="squircleClip">
      <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220"/>
    </clipPath>
  </defs>

  <!-- Squircle background, clipped so nothing bleeds past the rounded edge -->
  <g clip-path="url(#squircleClip)">
    <rect x="0" y="0" width="1024" height="1024" fill="url(#iconBg)"/>

    <!-- subtle inner glow for depth -->
    <ellipse cx="512" cy="380" rx="420" ry="300" fill="#2E8BE6" opacity="0.18"/>

    <!-- Mark, scaled up and centered, filling most of the safe area -->
    <g filter="url(#softShadow)" transform="translate(512 512) scale(3.05) translate(-232 -104)">

      <!-- Left curved form -->
      <path
        d="M 190 150
           C 150 150, 120 120, 128 82
           C 134 54, 162 34, 192 40
           C 224 46, 244 78, 236 112
           C 230 136, 212 150, 190 150 Z"
        fill="url(#blueGradientA)"
        opacity="0.95"
      />

      <!-- Right curved form, overlapping the first -->
      <path
        d="M 258 168
           C 214 168, 180 138, 186 98
           C 191 66, 222 44, 256 50
           C 292 57, 316 92, 306 128
           C 298 154, 278 168, 258 168 Z"
        fill="url(#blueGradientB)"
        opacity="0.9"
      />

      <!-- Connecting curve linking the two forms -->
      <path
        d="M 200 110 C 218 96, 236 96, 252 108"
        fill="none"
        stroke="#0B2545"
        stroke-width="6"
        stroke-linecap="round"
        opacity="0.35"
      />

      <!-- Upward growth arrow rising through the forms -->
      <path
        d="M 176 172
           L 236 108
           L 268 138
           L 336 62"
        fill="none"
        stroke="url(#arrowGradient)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M 300 58 L 336 62 L 334 98"
        fill="none"
        stroke="url(#arrowGradient)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
